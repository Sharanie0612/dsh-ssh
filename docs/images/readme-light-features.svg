      <g transform="translate(35 40) scale(1)" fill="none" stroke="#5b8fbc" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h15l5 6h23v27H5z"/><path d="M5 21h43"/></g>
      <text x="120" y="73" font-size="34" fill="#2d4359" font-weight="600" >远端工作区</text>
      <text x="121" y="120" font-size="24" fill="#61768a" font-weight="400" >选好主机与目录</text>
      <text x="121" y="156" font-size="24" fill="#61768a" font-weight="400" >新对话自动继承工程上下文</text>
      <text x="122" y="208" font-size="14" fill="#5b8fbc" font-weight="600" letter-spacing="1.7">WORKSPACE</text>
      <text x="525" y="208" font-size="17" fill="#5b8fbc" font-weight="500" >01</text>
    </g>
<g transform="translate(612 8)">
      <rect x="0.5" y="0.5" width="579" height="239" rx="23" fill="#f0f8f4" stroke="#e0eee7"/>
      <rect x="27" y="32" width="70" height="70" rx="20" fill="#fff" stroke="#e0eee7"/>
