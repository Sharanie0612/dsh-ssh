<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">DSH SSH 功能卡片</title>
  <desc id="desc">远端工作区：选择主机与目录。文件浏览：浏览目录与预览文本。交互终端：中文输入与尺寸调整。Agent 协作：命令执行、代码搜索编辑与文件传输。</desc>
  <defs>
    <filter id="shadow" x="-15%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#486788" flood-opacity=".07"/>
    </filter>
  </defs>
  <g font-family="&quot;Segoe UI&quot;, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, &quot;Noto Sans CJK SC&quot;, Arial, sans-serif"><g transform="translate(8 8)">
