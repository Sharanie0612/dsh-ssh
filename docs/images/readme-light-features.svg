      <text x="121" y="156" font-size="24" fill="#61768a" font-weight="400" >支持中文输入与尺寸调整</text>
      <text x="122" y="208" font-size="14" fill="#9180b0" font-weight="600" letter-spacing="1.7">TERMINAL</text>
      <text x="525" y="208" font-size="17" fill="#9180b0" font-weight="500" >03</text>
    </g>
<g transform="translate(612 264)">
