      <text x="121" y="156" font-size="24" fill="#61768a" font-weight="400" >从文件或目录发起对话</text>
      <text x="122" y="208" font-size="14" fill="#639b81" font-weight="600" letter-spacing="1.7">FILES</text>
      <text x="525" y="208" font-size="17" fill="#639b81" font-weight="500" >02</text>
    </g>
<g transform="translate(8 264)">
      <rect x="0.5" y="0.5" width="579" height="239" rx="23" fill="#f5f3fb" stroke="#e8e3f2"/>
